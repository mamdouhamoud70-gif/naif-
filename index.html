<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#1C2321">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>تسجيل الدخول - نظام الفقاسة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2321; --ink-soft:#2A322F; --paper:#F2EDE4; --paper-dim:#E7E0D3;
    --amber:#C98A3B; --amber-soft:#E4B476; --teal:#3E6259; --red:#B33A3A; --red-soft:#E7C6C1;
    --line:#3A423F; --line-light:#D9D0BE;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Cairo',sans-serif;
    background:radial-gradient(circle at 30% 20%, #2A332F 0%, #1C2321 60%);
    color:var(--paper);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .login-card{
    background:var(--paper); color:var(--ink);
    width:100%;max-width:380px;
    border-radius:14px;padding:34px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px;}
  .brand-mark{
    width:52px;height:52px;border-radius:12px;
    background:linear-gradient(155deg,var(--amber),var(--amber-soft));
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--ink);font-size:20px;
  }
  .brand h1{font-size:17px;font-weight:700;}
  .brand p{font-size:12px;color:#8A9089;margin-top:2px;}

  .field{margin-bottom:15px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:#5E655E;margin-bottom:6px;}
  .field input{
    width:100%;padding:11px 13px;border:1px solid var(--line-light);border-radius:8px;
    font-family:inherit;font-size:14px;background:#fff;color:var(--ink);outline:none;
    transition:border-color .15s;
  }
  .field input:focus{border-color:var(--amber);}

  .btn-login{
    width:100%;background:var(--amber);color:var(--ink);border:none;
    padding:12px;border-radius:8px;font-weight:700;font-size:14.5px;
    cursor:pointer;font-family:inherit;margin-top:6px;transition:filter .15s;
  }
  .btn-login:hover{filter:brightness(1.08);}
  .btn-login:disabled{opacity:.6;cursor:not-allowed;}

  .error-box{
    background:var(--red-soft);color:#7A2424;font-size:12.5px;font-weight:600;
    padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none;
  }
  .error-box.show{display:block;}

  .foot-note{text-align:center;font-size:11.5px;color:#9AA097;margin-top:18px;}
  .spinner{
    display:inline-block;width:14px;height:14px;border:2px solid rgba(28,35,33,.3);
    border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;
    vertical-align:middle;margin-inline-end:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <div class="brand-mark">فق</div>
    <h1>نظام إدارة الفقاسة</h1>
    <p>سجّل الدخول للمتابعة</p>
  </div>

  <div class="error-box" id="errorBox"></div>

  <form id="loginForm">
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="email" required autocomplete="username" placeholder="example@email.com">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn-login" id="loginBtn">دخول</button>
  </form>

  <div class="foot-note">نظام داخلي — الحسابات تُنشأ يدوياً من مدير النظام</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA3CJbQG70wGK2UdBImPYUOgeMMGFst0cg",
    authDomain: "naif-hatchery.firebaseapp.com",
    projectId: "naif-hatchery",
    storageBucket: "naif-hatchery.firebasestorage.app",
    messagingSenderId: "357172497976",
    appId: "1:357172497976:web:ec15d713477e980a10a0cd"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // If already logged in, go straight to the app
  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = './app.html';
  });

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const loginBtn = document.getElementById('loginBtn');

  const ERROR_MESSAGES = {
    'auth/invalid-email': 'البريد الإلكتروني غير صحيح',
    'auth/user-disabled': 'هذا الحساب معطّل',
    'auth/user-not-found': 'لا يوجد حساب بهذا البريد',
    'auth/wrong-password': 'كلمة المرور غير صحيحة',
    'auth/invalid-credential': 'البريد الإلكتروني أو كلمة المرور غير صحيحة',
    'auth/too-many-requests': 'محاولات كثيرة، حاول لاحقاً',
    'auth/network-request-failed': 'تحقق من اتصال الإنترنت',
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="spinner"></span> جاري الدخول...';

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = './app.html';
    } catch (err) {
      const msg = ERROR_MESSAGES[err.code] || 'حدث خطأ، حاول مرة أخرى';
      errorBox.textContent = msg;
      errorBox.classList.add('show');
      loginBtn.disabled = false;
      loginBtn.textContent = 'دخول';
    }
  });
</script>
</body>
</html>
