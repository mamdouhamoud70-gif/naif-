<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#1C2321">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الفقاسة">
<title>نظام إدارة الفقاسة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2321;
    --ink-soft:#2A322F;
    --paper:#F2EDE4;
    --paper-dim:#E7E0D3;
    --amber:#C98A3B;
    --amber-soft:#E4B476;
    --teal:#3E6259;
    --teal-soft:#5A857A;
    --green:#5C7A4E;
    --red:#B33A3A;
    --red-soft:#E7C6C1;
    --line:#3A423F;
    --line-light:#D9D0BE;
    --radius:10px;
    --font-ar:'Cairo',sans-serif;
    --font-num:'Space Grotesk',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font-ar);
    background:var(--ink);
    color:var(--paper);
    min-height:100vh;
    overflow-x:hidden;
  }
  body.lang-en{font-family:'Space Grotesk',sans-serif;}
  ::selection{background:var(--amber);color:var(--ink);}

  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:230px;flex-shrink:0;background:var(--ink-soft);
    border-inline-end:1px solid var(--line);
    display:flex;flex-direction:column;
    padding:22px 14px;
    position:sticky;top:0;height:100vh;
    transition:transform .25s ease;
    z-index:40;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    padding:0 8px 22px 8px;border-bottom:1px solid var(--line);margin-bottom:18px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(155deg,var(--amber),var(--amber-soft));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-num);font-weight:700;color:var(--ink);font-size:15px;
    flex-shrink:0;
  }
  .brand-text{line-height:1.25;}
  .brand-text .t1{font-size:14.5px;font-weight:700;color:var(--paper);}
  .brand-text .t2{font-size:11px;color:var(--teal-soft);font-family:var(--font-num);letter-spacing:.03em;}

  .nav{display:flex;flex-direction:column;gap:3px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;border-radius:8px;
    color:#B9BFB9;font-size:14px;font-weight:500;
    cursor:pointer;border:none;background:none;width:100%;text-align:inherit;
    font-family:inherit;
    transition:background .15s ease,color .15s ease;
  }
  .nav-item .ic{width:18px;height:18px;flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:rgba(201,138,59,.09);color:var(--paper);}
  .nav-item.active{background:rgba(201,138,59,.16);color:var(--amber-soft);}
  .nav-item.active .ic{opacity:1;}
  .nav-badge{
    margin-inline-start:auto;background:var(--red);color:#fff;
    font-family:var(--font-num);font-size:10.5px;font-weight:700;
    padding:1px 6px;border-radius:20px;min-width:18px;text-align:center;
  }

  .sidebar-foot{border-top:1px solid var(--line);padding-top:14px;margin-top:10px;}
  .lang-toggle{
    display:flex;background:var(--ink);border-radius:8px;padding:3px;gap:3px;
  }
  .lang-toggle button{
    flex:1;background:none;border:none;color:#8A8F8A;font-size:12.5px;font-weight:600;
    padding:7px 0;border-radius:6px;cursor:pointer;font-family:inherit;
    transition:background .15s, color .15s;
  }
  .lang-toggle button.active{background:var(--amber);color:var(--ink);}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 28px;border-bottom:1px solid var(--line);
    background:rgba(28,35,33,.9);backdrop-filter:blur(6px);
    position:sticky;top:0;z-index:30;
  }
  .topbar h1{font-size:19px;font-weight:700;}
  .topbar .sub{font-size:12.5px;color:#8A9089;margin-top:2px;}
  .menu-btn{display:none;background:none;border:none;color:var(--paper);cursor:pointer;padding:6px;}
  .clock{font-family:var(--font-num);font-size:12.5px;color:var(--teal-soft);text-align:end;}

  .content{padding:26px 28px 60px;flex:1;}
  .view{display:none;animation:fadein .25s ease;}
  .view.active{display:block;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .card{
    background:var(--paper);color:var(--ink);
    border-radius:var(--radius);padding:18px;
  }
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .section-head h2{font-size:16.5px;font-weight:700;}
  .section-head .desc{font-size:12.5px;color:#8A9089;margin-top:2px;}

  .btn{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--amber);color:var(--ink);border:none;
    padding:9px 16px;border-radius:8px;font-weight:700;font-size:13px;
    cursor:pointer;font-family:inherit;transition:filter .15s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;border:1px solid var(--line-light);color:var(--paper);}
  .btn.ghost:hover{background:rgba(255,255,255,.06);}
  .btn.sm{padding:6px 11px;font-size:12px;}
  .btn.danger{background:var(--red);color:#fff;}

  .status-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .stat{
    background:var(--ink-soft);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;position:relative;overflow:hidden;
  }
  .stat .num{font-family:var(--font-num);font-size:28px;font-weight:700;line-height:1;}
  .stat .lbl{font-size:12.5px;color:#9AA097;margin-top:8px;}
  .stat .bar{position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;}
  .stat.amber .bar{background:var(--amber);} .stat.amber .num{color:var(--amber-soft);}
  .stat.teal .bar{background:var(--teal);} .stat.teal .num{color:var(--teal-soft);}
  .stat.green .bar{background:var(--green);} .stat.green .num{color:#8FB37D;}
  .stat.red .bar{background:var(--red);} .stat.red .num{color:#E08F8F;}

  .dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  .panel-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}

  .alert-row{
    display:flex;align-items:center;gap:10px;padding:10px 0;
    border-bottom:1px solid var(--paper-dim);font-size:13px;
  }
  .alert-row:last-child{border-bottom:none;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.red{background:var(--red);} .dot.amber{background:var(--amber);}
  .alert-row .txt strong{display:block;font-weight:700;}
  .alert-row .txt span{font-size:11.5px;color:#8A9089;}

  canvas{max-width:100%;}
  .chart-wrap{height:190px;position:relative;}

  .station-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px;}
  .station-mini{background:var(--ink-soft);border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
  .station-mini .nm{font-size:12.5px;font-weight:700;color:var(--paper);}
  .station-mini .rate{font-family:var(--font-num);font-size:20px;font-weight:700;color:var(--amber-soft);margin-top:4px;}
  .station-mini .rate span{font-size:11px;color:#8A9089;font-weight:500;font-family:var(--font-ar);}
  .meter{height:5px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden;}
  .meter i{display:block;height:100%;background:var(--green);border-radius:4px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:start;font-weight:600;color:#7C837C;font-size:11.5px;
    padding:0 10px 10px;border-bottom:1px solid var(--paper-dim);
    background:var(--paper);position:sticky;top:0;
  }
  tbody td{padding:11px 10px;border-bottom:1px solid var(--paper-dim);color:var(--ink);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--paper-dim);}
  .table-wrap{overflow-x:auto;border-radius:var(--radius);}
  .num-cell{font-family:var(--font-num);font-weight:600;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
  .pill.ok{background:#DCE6D3;color:#3F5A33;}
  .pill.warn{background:#F3E1C4;color:#8A5B1E;}
  .pill.bad{background:var(--red-soft);color:#7A2424;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{background:none;border:none;cursor:pointer;color:#8A9089;padding:4px;border-radius:5px;}
  .icon-btn:hover{background:var(--paper-dim);color:var(--ink);}

  .search-bar{
    display:flex;align-items:center;gap:8px;background:var(--paper-dim);
    border-radius:8px;padding:8px 12px;margin-bottom:14px;max-width:340px;
  }
  .search-bar input{
    border:none;background:none;outline:none;font-family:inherit;font-size:13px;
    color:var(--ink);width:100%;
  }
  .search-bar svg{flex-shrink:0;opacity:.5;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}

  .empty{text-align:center;padding:50px 20px;color:#8A9089;}
  .empty .t{font-weight:700;color:var(--ink);font-size:14px;margin-bottom:4px;}
  .empty .s{font-size:12.5px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,13,12,.72);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--paper);color:var(--ink);border-radius:12px;
    width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
    padding:22px;
  }
  .modal h3{font-size:16px;font-weight:700;margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:600;color:#5E655E;margin-bottom:5px;}
  .field input,.field select{
    width:100%;padding:9px 11px;border:1px solid var(--line-light);border-radius:7px;
    font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);outline:none;
  }
  .field input:focus,.field select:focus{border-color:var(--amber);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}

  .toast-wrap{position:fixed;bottom:20px;inset-inline-end:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:var(--ink-soft);border:1px solid var(--line);color:var(--paper);
    padding:11px 16px;border-radius:8px;font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:8px;animation:slidein .2s ease;
    box-shadow:0 6px 20px rgba(0,0,0,.3);
  }
  @keyframes slidein{from{transform:translateY(10px);opacity:0;}to{transform:none;opacity:1;}}

  @media (max-width:980px){
    .status-strip{grid-template-columns:repeat(2,1fr);}
    .dash-grid{grid-template-columns:1fr;}
    .station-grid{grid-template-columns:repeat(2,1fr);}
    .grid-2,.grid-3{grid-template-columns:1fr;}
  }
  @media (max-width:760px){
    .sidebar{position:fixed;inset-inline-start:0;top:0;transform:translateX(105%);}
    html[dir="ltr"] .sidebar{transform:translateX(-105%);}
    .sidebar.open{transform:none;}
    .menu-btn{display:block;}
    .content{padding:18px 14px 50px;}
    .topbar{padding:14px 16px;}
    .status-strip{grid-template-columns:1fr 1fr;}
    .clock{display:none;}
  }
</style>
</head>

function lowStockMeds(){ return DB.medicines.filter(m => (m.stock/m.dosePerUnit) <= m.doseAlert); }
function nitrogenRemaining(){
  const daysSinceFill = daysBetween(DB.nitrogen.lastFillDate, new Date());
  return Math.max(0, DB.nitrogen.fill - daysSinceFill*DB.nitrogen.dailyUsage);
}
function nitrogenDaysLeft(){ return Math.floor(nitrogenRemaining()/DB.nitrogen.dailyUsage); }
function lowInventory(){ return DB.inventory.filter(i=>i.qty <= 30); }
function workersBack(){
  return DB.workers.map(w=>{
    const expectedReturn = new Date(new Date(w.leaveStart).getTime() + w.leaveDays*86400000);
    const daysBack = w.actualReturn ? daysBetween(w.actualReturn, new Date()) : null;
    return {...w, expectedReturn, daysBack};
  });
}
function activeWorkersOnLeave(){
  const now = new Date();
  return workersBack().filter(w => !w.actualReturn && w.expectedReturn >= now);
}

function drawHatchChart(){
  const canvas = document.getElementById('hatchChart');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const parent = canvas.parentElement;
  canvas.width = parent.clientWidth * 2; canvas.height = parent.clientHeight * 2;
  canvas.style.width = parent.clientWidth+'px'; canvas.style.height=parent.clientHeight+'px';
  ctx.scale(2,2);
  const w = parent.clientWidth, h = parent.clientHeight;
  const data = DB.stations.map(hatchRate);
  const max = 100, pad = 28;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle = '#E7E0D3'; ctx.lineWidth = 1;
  [0,25,50,75,100].forEach(v=>{
    const y = h - pad - (v/max)*(h-pad*1.4);
    ctx.beginPath(); ctx.moveTo(pad*0.3,y); ctx.lineTo(w-6,y); ctx.stroke();
    ctx.fillStyle = '#A6ABA3'; ctx.font='10px Space Grotesk'; ctx.textAlign='left';
    ctx.fillText(v+'%', 2, y-3);
  });
  const stepX = (w-pad*1.3)/(data.length-1);
  ctx.beginPath();
  data.forEach((v,i)=>{
    const x = pad*0.3 + i*stepX + 10;
    const y = h - pad - (v/max)*(h-pad*1.4);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.strokeStyle = '#C98A3B'; ctx.lineWidth = 2.5; ctx.lineJoin='round'; ctx.stroke();
  data.forEach((v,i)=>{
    const x = pad*0.3 + i*stepX + 10;
    const y = h - pad - (v/max)*(h-pad*1.4);
    ctx.beginPath(); ctx.arc(x,y,3.5,0,7); ctx.fillStyle='#C98A3B'; ctx.fill();
    ctx.fillStyle='#5E655E'; ctx.font='10px Cairo'; ctx.textAlign='center';
    ctx.fillText(DB.stations[i].name, x, h-6);
  });
}

  const list = workersBack();
  c.innerHTML = `
    <div class="card">
      <div class="section-head">
        <div><h2>${t('nav_workers')}</h2></div>
        <button class="btn" onclick="openWorkerForm()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>${t('addWorker')}
        </button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>${t('col_workerName')}</th><th>${t('col_fileNo')}</th><th>${t('col_leaveStart')}</th><th>${t('col_leaveDays')}</th>
          <th>${t('col_returnDate')}</th><th>${t('col_actualReturn')}</th><th>${t('col_daysBack')}</th><th>${t('col_actions')}</th>
        </tr></thead>
        <tbody>
        ${list.map(w=>`
          <tr>
            <td style="font-weight:700;">${w.name}</td>
            <td class="num-cell">${w.fileNo}</td>
            <td>${fmtDate(w.leaveStart)}</td>
            <td class="num-cell">${w.leaveDays}</td>
            <td>${fmtDate(w.expectedReturn)}</td>
            <td>${w.actualReturn?fmtDate(w.actualReturn):'—'}</td>
            <td class="num-cell">${w.daysBack!==null?w.daysBack:'—'}</td>
            <td class="row-actions">
              <button class="icon-btn" onclick="openWorkerForm(${w.id})" title="${t('edit')}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
              </button>
              <button class="icon-btn" onclick="deleteRow('workers',${w.id})" title="${t('delete')}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0v14a1 1 0 01-1 1H7a1 1 0 01-1-1V6"/></svg>
              </button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table></div>

}
function openWorkerForm(id){
  const w = id ? DB.workers.find(x=>x.id===id) : {name:'',fileNo:'',leaveStart:'',leaveDays:'',actualReturn:''};
  openModal(`
    <h3>${id?t('edit'):t('addWorker')}</h3>
    <div class="field"><label>${t('formWorkerName')}</label><input id="f_name" value="${w.name}"></div>
    <div class="field-row">
      <div class="field"><label>${t('formFileNo')}</label><input id="f_file" value="${w.fileNo}"></div>
      <div class="field"><label>${t('formLeaveDays')}</label><input id="f_days" type="number" value="${w.leaveDays}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>${t('formLeaveStart')}</label><input id="f_leaveStart" type="date" value="${w.leaveStart}"></div>
      <div class="field"><label>${t('col_actualReturn')}</label><input id="f_actual" type="date" value="${w.actualReturn||''}"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn" onclick="saveWorker(${id||'null'})">${t('save')}</button>
    </div>
  `);
}
function saveWorker(id){
  const vals = {
    name: document.getElementById('f_name').value.trim(),
    fileNo: document.getElementById('f_file').value,
    leaveDays: +document.getElementById('f_days').value || 0,
    leaveStart: document.getElementById('f_leaveStart').value,
    actualReturn: document.getElementById('f_actual').value || null,
  };
  if(!vals.name){ toast(LANG==='ar'?'اسم العامل مطلوب':'Worker name is required'); return; }
  if(id){ Object.assign(DB.workers.find(x=>x.id===id), vals); }
  else { DB.workers.push({id:++idCounter, ...vals}); }
  closeModal(); toast(t('toastSaved')); setView('workers');
}

function renderInventory(c, searchQ=''){
  const q = searchQ.toLowerCase();
  const items = DB.inventory.filter(i=> !q || i.name.toLowerCase().includes(q) || i.code.toLowerCase().includes(q));
  c.innerHTML = `
    <div class="card">
      <div class="section-head">
        <div><h2>${t('nav_inventory')}</h2></div>
        <button class="btn" onclick="openItemForm()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>${t('addItem')}
        </button>
      </div>
      <div class="search-bar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="invSearch" placeholder="${t('searchPlaceholder')}" value="${searchQ}">
      </div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>${t('col_itemCode')}</th><th>${t('col_itemName')}</th><th>${t('col_category')}</th>
          <th>${t('col_location')}</th><th>${t('col_box')}</th><th>${t('col_qty')}</th><th>${t('col_actions')}</th>
        </tr></thead>
        <tbody>
        ${items.length ? items.map(i=>`
          <tr>
            <td class="num-cell">${i.code}</td>
            <td style="font-weight:700;">${i.name}</td>
            <td>${i.category}</td>
            <td>${i.location}</td>
            <td class="num-cell">${i.box}</td>
            <td class="num-cell">${i.qty}${i.qty<=30?` <span class="pill bad" style="margin-inline-start:6px;">${t('statusWarn')}</span>`:''}</td>
            <td class="row-actions">
              <button class="icon-btn" onclick="openIssueForm(${i.id})" title="${t('logUsage')}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              </button>
              <button class="icon-btn" onclick="openItemForm(${i.id})" title="${t('edit')}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
              </button>
              <button class="icon-btn" onclick="deleteRow('inventory',${i.id})" title="${t('delete')}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0v14a1 1 0 01-1 1H7a1 1 0 01-1-1V6"/></svg>
              </button>
            </td>
          </tr>`).join('') : `<tr><td colspan="7"><div class="empty"><div class="t">${t('emptyTitle')}</div></div></td></tr>`}
        </tbody>
      </table></div>
    </div>`;
  document.getElementById('invSearch').addEventListener('input', e=>renderInventory(c, e.target.value));
  document.getElementById('invSearch').focus();
  document.getElementById('invSearch').setSelectionRange(searchQ.length, searchQ.length);
}
function openItemForm(id){
  const i = id ? DB.inventory.find(x=>x.id===id) : {code:'',name:'',category:'',location:'',box:'',qty:''};
  openModal(`
    <h3>${id?t('edit'):t('addItem')}</h3>
    <div class="field-row">
      <div class="field"><label>${t('formItemCode')}</label><input id="f_code" value="${i.code}"></div>
      <div class="field"><label>${t('formItemName')}</label><input id="f_name" value="${i.name}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>${t('formCategory')}</label><input id="f_cat" value="${i.category}"></div>
      <div class="field"><label>${t('formLocation')}</label><input id="f_loc" value="${i.location}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>${t('formBox')}</label><input id="f_box" value="${i.box}"></div>
      <div class="field"><label>${t('formQty')}</label><input id="f_qty" type="number" value="${i.qty}"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn" onclick="saveItem(${id||'null'})">${t('save')}</button>
    </div>
  `);
}
function saveItem(id){
  const vals = {
    code: document.getElementById('f_code').value,
    name: document.getElementById('f_name').value.trim(),
    category: document.getElementById('f_cat').value,
    location: document.getElementById('f_loc').value,
    box: document.getElementById('f_box').value,
    qty: +document.getElementById('f_qty').value || 0,
  };
  if(!vals.name){ toast(LANG==='ar'?'اسم الصنف مطلوب':'Item name is required'); return; }
  if(id){ Object.assign(DB.inventory.find(x=>x.id===id), vals); }
  else { DB.inventory.push({id:++idCounter, ...vals, log:[]}); }
  closeModal(); toast(t('toastSaved')); setView('inventory');
}
function openIssueForm(id){
  const i = DB.inventory.find(x=>x.id===id);
  openModal(`
    <h3>${t('logUsage')} — ${i.name}</h3>
    <div class="field"><label>${LANG==='ar'?'الكمية المصروفة':'Quantity issued'}</label><input id="f_issue" type="number" min="1" max="${i.qty}"></div>
    <div style="font-size:12px;color:#8A9089;margin-top:-6px;">${LANG==='ar'?`المتاح حالياً: ${i.qty}`:`Available: ${i.qty}`}</div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn" onclick="saveIssue(${id})">${t('save')}</button>
    </div>
  `);
}
function saveIssue(id){
  const amt = +document.getElementById('f_issue').value || 0;
  const i = DB.inventory.find(x=>x.id===id);
  if(amt<=0 || amt>i.qty){ toast(LANG==='ar'?'كمية غير صحيحة':'Invalid quantity'); return; }
  i.qty -= amt;
  i.log.push({date:new Date().toISOString().slice(0,10), amt});
  closeModal(); toast(t('toastSaved')); setView('inventory');
}

function deleteRow(coll, id){
  DB[coll] = DB[coll].filter(x=>x.id!==id);
  toast(t('toastDeleted'));
  setView(window.__view);
}

function setLang(lang){
  LANG = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('lang-en', lang==='en');
  document.getElementById('btnAr').classList.toggle('active', lang==='ar');
  document.getElementById('btnEn').classList.toggle('active', lang==='en');
  document.getElementById('brandName').textContent = lang==='ar' ? 'نظام الفقاسة' : 'Hatchery System';
  setView(window.__view || 'dashboard');
}
document.getElementById('btnAr').addEventListener('click',()=>setLang('ar'));
document.getElementById('btnEn').addEventListener('click',()=>setLang('en'));

document.getElementById('menuBtn').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.toggle('open');
});
function tickClock(){
  const now = new Date();
  document.getElementById('clockBox').innerHTML = now.toLocaleDateString(LANG==='ar'?'ar-EG':'en-GB',{weekday:'long',day:'numeric',month:'short'}) +
    '<br>' + now.toLocaleTimeString(LANG==='ar'?'ar-EG':'en-GB',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tickClock, 1000*30);

setLang('ar');
setView('dashboard');
tickClock();
toast(t('demoNotice'));
window.addEventListener('resize', ()=>{ if(window.__view==='dashboard') drawHatchChart(); });

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
